name: CleanMac
options:
  bundleIdPrefix: com.cleanmac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.38.0"
  # English is the source language of Localizable.xcstrings; every key in that
  # catalog is its own English text, so a missing translation falls back to the
  # key and the app stays correct in locales that have no column yet.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Deliberately empty and never committed with a real value. scripts/build.sh
    # and scripts/notarize.sh auto-detect the team from the keychain
    # (`security find-identity -v -p codesigning`, spec §1) and override this on
    # the xcodebuild command line, so the same checkout builds on any signed-in
    # machine without editing this file.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO         # required: we clean system caches
    ENABLE_USER_SELECTED_FILES: readwrite
    GCC_OPTIMIZATION_LEVEL: "s"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Prefer the .xcstrings catalog over legacy .strings/.lproj folders.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # No generated symbol API. Keys here are natural English text, and many are
    # not valid Swift identifiers at all ("%1$@ · %2$@"), so symbol generation
    # would emit unusable names; lookup goes through `L10n` instead.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
  configs:
    # Distribution is Developer ID + notarization, outside the Mac App Store.
    # Debug builds stay ad-hoc so the app runs locally without a team.
    Debug:debug
    Release:release

targets:
  CleanMac:
    type: application
    platform: macOS
    displayName: CleanMac
    sources:
      # Exclude the resource files from the recursive source glob so they are
      # not compiled, then re-add each one below as an explicit source entry
      # forced into the resources build phase. A previous `resources:` folder
      # reference (`type: folder`) never landed in the product's Copy Bundle
      # Resources phase — the files fell under this `sources` path and were
      # filtered out by these excludes before the resource declaration could
      # pick them up. Declaring them as `buildPhase: resources` source entries
      # is the reliable XcodeGen way to ship a file that lives under a source
      # tree.
      - path: CleanMac
        excludes:
          - "Resources/Rules/**"
          - "Resources/Localizable.xcstrings"
      # The three bundled YAML rule packs. A normal (file) resource copy
      # flattens these into Contents/Resources/, which RuleLoader resolves via
      # its flat `url(forResource:withExtension:)` fallback (the
      # `subdirectory: "Rules"` lookup returns nil, the flat one succeeds).
      - path: CleanMac/Resources/Rules/system-junk.yaml
        type: file
        buildPhase: resources
      - path: CleanMac/Resources/Rules/uninstaller-leftovers.yaml
        type: file
        buildPhase: resources
      - path: CleanMac/Resources/Rules/large-files-defaults.yaml
        type: file
        buildPhase: resources
      # The string catalog. Generated from the L10n call sites by
      # `.verify/genstrings.py --write`; do not hand-edit, and do not let it
      # drift -- `LocalizationTests` asserts source/catalog parity.
      - path: CleanMac/Resources/Localizable.xcstrings
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanmac.app
        PRODUCT_NAME: CleanMac
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: CleanMac/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: CleanMac/Supporting/CleanMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS:
          - DEBUG
      configs:
        debug:
          CODE_SIGN_IDENTITY: "-"     # ad-hoc, for local runs
        release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          # Secure timestamp is mandatory for notarization.
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
    scheme:
      testTargets:
        - CleanMacTests
      commandLineArguments:
        arguments:
          - argument: "-AppleLanguages"
            isEnabled: false
          - argument: "(en)"
            isEnabled: false
      environmentVariables:
        OS_ACTIVITY_MODE:
          value: disable
          isEnabled: true

  CleanMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CleanMacTests
    dependencies:
      - target: CleanMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanmac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CleanMac.app/Contents/MacOS/CleanMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
